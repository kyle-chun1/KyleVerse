
project:
  type: website
  pre-render:
    - python3 scripts/verse_of_day.py render
  render:
    - "*.qmd"
  resources:
    - "!scripts/"
    - "!tests/"
    - "!data/"
    - "!docs/"
    - "!_verse/"

website:
  title: "Kyle's World"
  navbar:
    background: "#F7F0E5"
    foreground: "#504A43"
    right:
      - text: Home
        href: index.qmd
      - text: About
        href: about.qmd
      - text: Projects
        href: projects.qmd
      - text: Photography
        href: photography.qmd
      - text: Writing
        href: writing.qmd

filters:
  - scripts/verse-of-day.lua

format:
  html:
    theme: cosmo
    css: styles.css
    toc: false
