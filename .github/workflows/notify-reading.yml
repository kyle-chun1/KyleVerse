name: Reading-book notifications
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      initialize:
        description: "First activation only: type INITIALIZE NOTIFICATION JOURNAL"
        required: false
        default: ""
        type: string
permissions:
  contents: read
concurrency:
  group: kyleverse-reading-notifications
  cancel-in-progress: false
jobs:
  notify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.2'
      - name: Install existing notification dependencies
        run: Rscript scripts/install_dependencies.R
      - name: Test the journal with mocked storage and SMTP
        run: Rscript tests/test_notifications.R
      - name: Discover and process journaled reading events
        env:
          GH_TOKEN: ${{ github.token }}
          KYLEVERSE_NOTIFICATION_EMAIL: ${{ secrets.KYLEVERSE_NOTIFICATION_EMAIL }}
          GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
          GMAIL_SMTP_APP_PASSWORD: ${{ secrets.GMAIL_SMTP_APP_PASSWORD }}
          NOTIFICATION_INITIALIZE: ${{ inputs.initialize }}
          READING_CURRENT_SHA: ${{ github.sha }}
        run: Rscript scripts/reading_email.R --send
